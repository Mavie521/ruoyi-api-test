# Prometheus 抓取配置
global:
  scrape_interval: 15s        # 每 15 秒采集一次

scrape_configs:
  # 采集 VM 宿主资源（CPU / 内存 / 磁盘 / 网络）
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # 采集若依后端 JVM（堆 / GC / 线程 / 类加载）
  - job_name: 'jvm'
    static_configs:
      - targets: ['host.docker.internal:9404']

  # 采集 MySQL 指标（连接 / 慢查询 / 缓存命中率）
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysqld-exporter:9104']
